openapi: 3.0.0
info:
  title: API CEP
  version: "1.0.0"
  description: API simples para consulta de CEPs via ViaCEP
servers:
  - url: http://localhost:8000
    description: Servidor local
paths:
  /cep/{cep}:
    get:
      summary: Consulta de CEP
      description: Retorna informações sobre um CEP específico usando a API ViaCEP.
      tags:
        - CEP
      parameters:
        - name: cep
          in: path
          required: true
          description: CEP ano formato XXXXX-XXX ou XXXXXXXX
          schema:
            type: string
            pattern: '^\d{5}-?\d{3}$'
            example: '01001000'
      responses:
        '200': 
          description: Sucesso - Retorna informações do CEP
          content:
            application/json:
              schema:
                type: object
                properties:
                  cep:
                    type: string
                    example: '01001-000'
                  logradouro:
                    type: string
                    example: 'Praça da Sé'
                  complemento:
                    type: string
                    example: 'lado ímpar'
                  bairro:
                    type: string
                    example: 'Sé'
                  localidade:
                    type: string
                    example: 'São Paulo'
                  uf:
                    type: string
                    example: 'SP'
        '404':
          description: CEP não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'CEP não encontrado'
        '502':
          description: Erro de comunicação com a API ViaCEP
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Erro ao consultar a API ViaCEP'